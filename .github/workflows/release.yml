name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Trusted Publishing: NuGet exchanges the workflow's OIDC token for a short-lived API key.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json
      - name: Pack
        run: dotnet pack Twinbox.slnx -c Release -o artifacts -p:Version=${GITHUB_REF_NAME#v}
      - name: NuGet login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --generate-notes $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
