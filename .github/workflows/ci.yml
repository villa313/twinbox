name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json
      - run: dotnet build Twinbox.slnx -c Release
      - run: dotnet pack Twinbox.slnx -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

  templates:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      # Generates an app for every store and transport from the packages just built, and builds each with warnings as errors.
      - run: eng/test-templates.sh artifacts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One runner can't hold every database and broker image, so each group pulls only its own.
      matrix:
        include:
          - group: core
            projects: UnitTests SourceGenerators.Tests Webhooks.Tests Http.Tests Dashboard.Tests AzureFunctions.Tests Aspire.Tests
          - group: databases
            projects: Relational.IntegrationTests EntityFrameworkCore.IntegrationTests MongoDB.IntegrationTests
          - group: azure-aws-google
            projects: AzureServiceBus.Tests EventHubs.Tests AmazonSqs.Tests GooglePubSub.Tests
          - group: brokers
            projects: Kafka.Tests Pulsar.Tests RabbitMQ.Tests Nats.Tests RedisStreams.Tests
          - group: chaos
            projects: Chaos.Tests
    name: test (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for container images
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift && df -h /
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json
      - name: Test
        run: |
          failed=0
          for project in ${{ matrix.projects }}; do
            dotnet test --project "tests/Twinbox.$project" -c Release || failed=1
          done
          exit $failed

  native-aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      # Trim and AOT warnings fail the publish; the binary exits nonzero unless every message was handled exactly once.
      - run: dotnet publish samples/Twinbox.AotSmoke/Twinbox.AotSmoke.csproj -c Release -r linux-x64 -o artifacts/aot-smoke
      - run: ./artifacts/aot-smoke/Twinbox.AotSmoke
