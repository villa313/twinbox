name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json
      - run: dotnet restore Twinbox.slnx
      - run: dotnet build Twinbox.slnx -c Release --no-restore
      # Integration tests start database and broker containers; capping modules keeps runners from running out of memory.
      - run: dotnet test --solution Twinbox.slnx -c Release --no-build --max-parallel-test-modules 3
      - run: dotnet pack Twinbox.slnx -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

  native-aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      # Trim and AOT warnings fail the publish; the binary exits nonzero unless every message was handled exactly once.
      - run: dotnet publish samples/Twinbox.AotSmoke/Twinbox.AotSmoke.csproj -c Release -r linux-x64 -o artifacts/aot-smoke
      - run: ./artifacts/aot-smoke/Twinbox.AotSmoke
